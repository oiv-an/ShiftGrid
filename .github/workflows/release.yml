name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag and version
        shell: zsh {0}
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            print -u2 "Tag ${GITHUB_REF_NAME} does not match Info.plist version ${version}"
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Package Universal 2 app
        env:
          CODE_SIGN_IDENTITY: '-'
        run: ./Scripts/package-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: zsh {0}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/ShiftGrid-*-macOS-universal.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/ShiftGrid-*-macOS-universal.zip \
              dist/SHA256SUMS.txt \
              --verify-tag \
              --title "ShiftGrid ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          fi
